services:
  postgres:
    # Render 관리형 DB와 같은 메이저 버전
    image: postgres:16
    container_name: moa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: moa
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: moa
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa -d moa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
